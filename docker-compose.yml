services:
  db:
    image: postgres:latest
    container_name: postgres_prod
    restart: always
    environment:
      POSTGRES_DB: mydatabase_dev
      POSTGRES_USER: SA
      POSTGRES_PASSWORD: Pi3141592654!
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  phoenix:
    build: .
    container_name: phoenix_app
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - db
    environment:
      - MIX_ENV=prod
      - DATABASE_URL=ecto://SA:Pi3141592654!@db/mydatabase_dev
      - SECRET_KEY_BASE=JwgEh9Q8gKEoBbloDDjJujveauq+TSub0KtyGngTxjfor+wdjT85IpZf48nusuC4
    command: mix phx.server

  pgadmin:
    image: dpage/pgadmin4:snapshot
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
volumes:
  pgdata:
